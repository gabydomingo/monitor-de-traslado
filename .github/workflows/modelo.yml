name: modelo

# corre despues de cada ingesta. casi todos los dias no hay nada nuevo y termina enseguida;
# cuando ya salieron el ipc y el mayorista del mes y el dolar hasta el 13, pronostica.
# despues arma los json de la web: si cambiaron, el push hace que vercel la vuelva a publicar
on:
  workflow_run:
    workflows: [ingesta]
    types: [completed]
  workflow_dispatch:
    inputs:
      forzar:
        description: "correr aunque ya este pronosticado"
        type: boolean
        default: false

permissions:
  contents: write

# mismo grupo que la ingesta para no pisarse los push
concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  modelo:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # main y no el commit que disparo la ingesta: asi trae los datos que acaba de subir
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      # sin cache: en workflow_run setup-uv lo apaga por defecto (riesgo de cache envenenado)
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - run: uv sync --locked --no-dev

      - name: warehouse
        working-directory: dbt
        run: uv run dbt build

      - name: modelos
        env:
          FORZAR: ${{ inputs.forzar && '--forzar' || '' }}
        run: uv run python -m monitor.mensual $FORZAR

      # todos los dias, no solo cuando hay pronostico: si salio el ipc la web tiene que
      # mostrar el dato nuevo y cuanto le erro al pronostico. si no cambio nada, el json
      # queda igual y no hay commit
      - name: datos de la web
        run: uv run python -m monitor.web

      - name: commitear resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resultados data/web
          if git diff --cached --quiet; then
            echo "Sin resultados nuevos"
            exit 0
          fi
          git commit -m "modelo: resultados y web $(date -u +%Y-%m-%d)"
          # si alguien pusheo en el medio, reintento: sin esto se pierde lo que se bajo
          for intento in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 15))
          done
          exit 1

      # al final y aparte: si la ingesta se trabo, la corrida queda en rojo y llega el mail,
      # pero la web ya se actualizo con lo que habia
      - name: datos al dia
        working-directory: dbt
        run: uv run dbt source freshness
