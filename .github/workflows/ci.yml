name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv ya no publica el tag v10, solo versiones completas
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: tests
        run: uv run pytest

      # corre sobre los datos de data/raw
      - name: dbt build
        working-directory: dbt
        run: uv run dbt build
