name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv ya no publica el tag v10, solo versiones completas
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: tests
        run: uv run pytest

      # corre sobre los datos de data/raw
      - name: dbt build
        working-directory: dbt
        run: uv run dbt build

  # la web: que compile con los json que hay en data/web y que los tipos esten al dia
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # si alguien cambio el contrato en python y no regenero los tipos, falla aca
      - name: tipos
        run: |
          npm run tipos
          git diff --exit-code lib/tipos.ts

      - run: npm run build
