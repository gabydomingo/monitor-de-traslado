name: ci

on:
  push:
  pull_request:

# el ci solo lee: no tiene por que poder escribir en el repo
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: tests
        run: uv run pytest

      # corre sobre los datos de data/raw
      - name: dbt build
        working-directory: dbt
        run: uv run dbt build

  # la web: que compile con los json que hay en data/web y que los tipos esten al dia
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # si alguien cambio el contrato en python y no regenero los tipos, falla aca
      - name: tipos
        run: |
          npm run tipos
          git diff --exit-code lib/tipos.ts

      - run: npm run build
