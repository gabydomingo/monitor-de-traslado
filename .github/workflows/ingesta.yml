name: ingesta

on:
  schedule:
    - cron: "23 23 * * *"   # 20:23 hora arg, ultimos meses
    - cron: "47 23 20 * *"  # el 20 de cada mes, todo
  workflow_dispatch:
    inputs:
      modo:
        description: "reciente = ultimos meses, completo = toda la historia"
        type: choice
        options: [reciente, completo]
        default: reciente

permissions:
  contents: write

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true

      - run: uv sync --locked --no-dev

      - name: elegir modo
        id: modo
        env:
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          MODO_MANUAL: ${{ inputs.modo }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "modo=$MODO_MANUAL" >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = "47 23 20 * *" ]; then
            echo "modo=completo" >> "$GITHUB_OUTPUT"
          else
            echo "modo=reciente" >> "$GITHUB_OUTPUT"
          fi

      - name: bajar datos
        env:
          INDEC_API_TOKEN: ${{ secrets.INDEC_API_TOKEN }}
          MODO: ${{ steps.modo.outputs.modo }}
        run: uv run python -m monitor.ingesta --modo "$MODO"

      # fechas de publicacion del indec: el pronostico corta el dolar el dia antes de que
      # salga el mayorista. si la web del indec no responde, la ingesta sigue igual
      - name: calendario de publicaciones
        continue-on-error: true
        run: uv run python -m monitor.informes calendario

      # aunque falle un dataset, lo que se bajo bien se guarda
      - name: commitear versiones nuevas
        if: success() || failure()
        env:
          MODO: ${{ steps.modo.outputs.modo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/informes/listado.csv
          if git diff --cached --quiet; then
            echo "Sin versiones nuevas, no hay nada que commitear"
            exit 0
          fi
          git commit -m "datos: $MODO $(date -u +%Y-%m-%d)"
          # si alguien pusheo en el medio, reintento: sin esto se pierde lo que se bajo
          for intento in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 15))
          done
          exit 1
