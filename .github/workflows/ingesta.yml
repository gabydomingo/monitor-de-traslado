name: ingesta

on:
  schedule:
    - cron: "23 23 * * *"   # todos los dias 20:23 (hora argentina): ultimos meses
    - cron: "47 23 20 * *"  # el 20 de cada mes: toda la historia
  workflow_dispatch:
    inputs:
      modo:
        description: "reciente = ultimos meses, completo = toda la historia"
        type: choice
        options: [reciente, completo]
        default: reciente

permissions:
  contents: write   # para commitear los datos nuevos

concurrency:
  group: ingesta    # nunca dos corridas a la vez escribiendo en data/raw
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked --no-dev

      - name: elegir modo
        id: modo
        env:
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          MODO_MANUAL: ${{ inputs.modo }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "modo=$MODO_MANUAL" >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = "47 23 20 * *" ]; then
            echo "modo=completo" >> "$GITHUB_OUTPUT"
          else
            echo "modo=reciente" >> "$GITHUB_OUTPUT"
          fi

      - name: bajar datos
        env:
          INDEC_API_TOKEN: ${{ secrets.INDEC_API_TOKEN }}
        run: uv run python -m monitor.ingesta --modo "${{ steps.modo.outputs.modo }}"

      # corre aunque falle un dataset: lo que si se bajo bien se guarda igual
      - name: commitear versiones nuevas
        if: success() || failure()
        env:
          MODO: ${{ steps.modo.outputs.modo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "Sin versiones nuevas, no hay nada que commitear"
            exit 0
          fi
          git commit -m "datos: $MODO $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
