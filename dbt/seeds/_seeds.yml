version: 2

seeds:
  - name: correspondencia_ciiu_coicop
    description: >
      Que codigo del mayorista (ciiu rev. 3) va con que rubro del ipc (coicop 2019).
      Una fila por rubro y codigo. etapa: primaria (productor) o industria.
    columns:
      - name: par_id
        tests: [not_null]
      - name: etapa
        tests:
          - accepted_values:
              arguments:
                values: [primaria, industria]
      - name: calidad
        tests:
          - accepted_values:
              arguments:
                values: [alta, media, baja]

  - name: provincias
    description: >
      Provincia y su region del ipc, con el codigo de provincia del indec para cruzar
      con el geojson. El indec no publica precios por provincia.
    columns:
      - name: provincia_id
        tests: [unique, not_null]
      - name: region
        tests:
          - accepted_values:
              arguments:
                values: [GBA, Pampeana, Noreste, Noroeste, Cuyo, Patagonia]
