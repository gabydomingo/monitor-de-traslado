name: monitor_traslado
version: "1.0.0"
profile: monitor_traslado

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages", "logs"]

flags:
  send_anonymous_usage_stats: false

models:
  monitor_traslado:
    staging:
      +materialized: view
    intermediate:
      # tabla y no vista: la vista lee los parquet con ruta relativa y se rompe
      # si se consulta desde otra carpeta que no sea dbt/ o notebooks/
      +materialized: table
    marts:
      +materialized: table

seeds:
  monitor_traslado:
    # codigos como texto, si no "0121" queda 121
    correspondencia_ciiu_coicop:
      +column_types:
        coicop_codigo: varchar
        ciiu_codigo: varchar
    provincias:
      +column_types:
        provincia_id: varchar
    informes_codigos:
      +column_types:
        codigo: varchar
