version: 2

models:
  - name: int_series_indice
    description: >
      Indices del ipc y del mayorista en formato largo. var_mensual en % y var_log,
      las dos calculadas desde el indice.
    columns:
      - name: indice
        description: Solo puede estar vacio si el indec lo marco como sin dato.
        tests:
          - not_null:
              config:
                where: "not sin_dato_indec"
      - name: sin_dato_indec
        description: >
          El indec no pudo relevarlo ("///"). Pasa en la cuarentena de 2020: restaurantes
          de abril a julio y ropa y calzado en abril. Se deja vacio, no se completa.
