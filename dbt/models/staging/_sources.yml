version: 2

sources:
  - name: raw
    description: Los parquet que guarda la ingesta en data/raw, todas las versiones juntas
    meta:
      external_location: "read_parquet('../data/raw/{name}/*/*.parquet', union_by_name = true)"
    config:
      loaded_at_field: "cast(_descargado_utc as timestamp)"
      freshness:
        warn_after: {count: 3, period: day}
        error_after: {count: 10, period: day}
    tables:
      - name: ipc
        description: ipc_nacional, desde abr-2016
      - name: mayorista
        description: sipm_precios_mayoristas, desde dic-2015
      - name: bcra
        description: Dolar mayorista (com. A 3500) y mediana del REM a 12 meses, desde 2015
