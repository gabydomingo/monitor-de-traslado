version: 2

unit_tests:
  - name: stg_ipc_normaliza_nombres
    model: stg_ipc__versiones
    given:
      # la fuente es un parquet y dbt no puede leerle las columnas, por eso va en sql.
      # chr(250) es una u con tilde y chr(237) una i con tilde, como las manda el indec
      - input: source('raw', 'ipc')
        format: sql
        rows: |
          select * from (values
            ('Estacionales, N' || chr(250) || 'cleo y Regulados', 'Categor' || chr(237) || 'a',
             'N', 'Nucleo', 'GBA', 'Indice', 202610, 'Unidad', 10.0, null, null,
             '2026-11-26T04:28:28+00:00', 'completo'),
            ('IPC', 'Nivel General', '0', 'NIVEL GENERAL', 'GBA', 'Indice',
             202003, 'Unidad', 20.0, null, null, '2026-11-26T04:28:28+00:00', 'completo'),
            ('COICOP Argentina 2019', 'Grupo', '11.1', 'Restaurantes', 'GBA', 'Indice',
             202004, 'Unidad', null, '///', null, '2026-11-26T04:28:28+00:00', 'completo')
          ) as t(clasificador, nivel, codigo, descripcion, region, tipo_de_indicador,
                 periodo, unidad_de_medida, valor, valor_null, observaciones,
                 _descargado_utc, _ventana)
    expect:
      rows:
        - {clasificador: "Estacional, Nucleo y Regulados", nivel: Categoria,
           descripcion: Nucleo, fecha: 2026-10-01, sin_dato_indec: false}
        - {clasificador: IPC, nivel: Nivel General, descripcion: Nivel general,
           fecha: 2020-03-01, sin_dato_indec: false}
        - {clasificador: COICOP Argentina 2019, nivel: Grupo, descripcion: Restaurantes,
           fecha: 2020-04-01, sin_dato_indec: true}

  - name: stg_ipc_vigente_es_la_ultima_descarga_del_mes
    description: Si una descarga nueva ya no trae una fila (el indec la borro), no queda viva.
    model: stg_ipc
    given:
      - input: ref('stg_ipc__versiones')
        rows:
          - {codigo: "01", region: GBA, periodo: 202610, valor: 100.0,
             descargado_utc: "2026-11-26 04:00:00"}
          - {codigo: "02", region: GBA, periodo: 202610, valor: 50.0,
             descargado_utc: "2026-11-26 04:00:00"}
          - {codigo: "01", region: GBA, periodo: 202609, valor: 90.0,
             descargado_utc: "2026-11-26 04:00:00"}
          - {codigo: "01", region: GBA, periodo: 202610, valor: 101.0,
             descargado_utc: "2026-12-12 19:00:00"}
    expect:
      rows:
        - {codigo: "01", periodo: 202610, valor: 101.0}
        - {codigo: "01", periodo: 202609, valor: 90.0}
