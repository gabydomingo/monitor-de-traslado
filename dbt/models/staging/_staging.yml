version: 2

models:
  - name: stg_ipc__versiones
    description: Todas las versiones del ipc. De aca salen las revisiones.
    columns:
      - name: descargado_utc
        tests: [not_null]

  - name: stg_ipc
    description: Ipc vigente, la ultima version de cada dato.
    tests:
      - combinacion_unica:
          arguments:
            columnas: [clasificador, nivel, codigo, region, tipo_de_indicador, periodo]
    columns:
      - name: clasificador
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [IPC, COICOP Argentina 2019, Bienes y servicios,
                         "Estacional, Nucleo y Regulados"]
      - name: region
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Nacional, GBA, Pampeana, Noreste, Noroeste, Cuyo, Patagonia]
      - name: codigo
        tests: [not_null]
      - name: fecha
        tests: [not_null]

  - name: stg_mayorista__versiones
    description: Todas las versiones del mayorista.
    columns:
      - name: descargado_utc
        tests: [not_null]

  - name: stg_mayorista
    description: Mayorista vigente, la ultima version de cada dato.
    tests:
      - combinacion_unica:
          arguments:
            columnas: [indicador, clasificador, nivel, codigo, region,
                       tipo_de_indicador, periodo]
    columns:
      - name: indicador
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [IPIM, IPIB, IPP]
      - name: region
        tests:
          - accepted_values:
              arguments:
                values: [Total del pais]
      - name: codigo
        tests: [not_null]
      - name: fecha
        tests: [not_null]

  - name: stg_bcra__versiones
    description: Todas las versiones de las series del bcra.
    columns:
      - name: descargado_utc
        tests: [not_null]

  - name: stg_bcra
    description: Series del bcra vigentes, la ultima version de cada dato.
    tests:
      - combinacion_unica:
          arguments:
            columnas: [id_variable, fecha]
    columns:
      - name: variable
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [tipo_cambio_mayorista, rem_12m]
      - name: valor
        tests: [not_null]

  - name: stg_informes__calendario
    description: Fecha en que se publico cada mes del mayorista y del ipc.
    tests:
      - combinacion_unica:
          arguments:
            columnas: [dataset, fecha]
    columns:
      - name: publicado
        tests: [not_null]

  - name: stg_informes__primeros_datos
    description: Variacion mensual tal como salio en el informe, con el codigo de la api.
    tests:
      - combinacion_unica:
          arguments:
            columnas: [dataset, indicador, region, codigo, fecha]
    columns:
      - name: codigo
        description: Si un nombre nuevo no esta en el seed informes_codigos, queda vacio y falla.
        tests: [not_null]
