version: 2

models:
  - name: dim_rubro
    description: Los 19 rubros que se pueden comparar entre mayorista e ipc.
    columns:
      - name: par_id
        tests: [unique, not_null]
      - name: tiene_etapa_primaria
        description: Hay precio del productor (carnes, lacteos, pan, frutas, verduras).
      - name: es_contraste
        description: Energia. Es tarifa regulada, asi que no es traslado de mercado.

  - name: dim_region
    description: Regiones del ipc, el total nacional y el total del pais del mayorista.
    columns:
      - name: region
        tests: [unique, not_null]

  - name: dim_provincia
    description: Provincia y su region del ipc, para el mapa.
    columns:
      - name: provincia_id
        tests: [unique, not_null]
      - name: region
        tests:
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region

  - name: fct_precios
    description: >
      Cada rubro en cada etapa. Gondola viene por region, el mayorista solo como total
      del pais.
    tests:
      - combinacion_unica:
          arguments:
            columnas: [par_id, etapa, indicador, codigo, region, fecha]
    columns:
      - name: par_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_rubro')
                field: par_id
      - name: etapa
        tests:
          - accepted_values:
              arguments:
                values: [primaria, industria, gondola]
      - name: region
        tests:
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region

  - name: fct_revisiones
    description: Datos que el indec corrigio despues de publicarlos (indices y precios promedio).

  - name: fct_bcra_mensual
    description: >
      Dolar mayorista y expectativa de inflacion del REM por mes. tc_inicio_mes es el
      promedio del 1 al 13, que ya se conoce cuando se hace el pronostico.
    columns:
      - name: fecha
        tests: [unique, not_null]
      - name: tc_promedio
        tests: [not_null]
      - name: tc_inicio_mes
        tests: [not_null]
      - name: corte
        description: Hasta que dia (sin incluir) se promedia tc_inicio_mes.
        tests: [not_null]

  - name: fct_primer_dato
    description: >
      El primer dato que publico el indec (informes de prensa) contra el vigente en la
      api. revision = actual - publicado, con un decimal.
    columns:
      - name: valor_actual
        description: El ipp de productos importados no existe (///), por eso queda afuera.
        tests:
          - not_null:
              config:
                where: "not (indicador = 'IPP' and codigo = 'I')"
      - name: publicado
        tests: [not_null]

  - name: fct_publicaciones
    description: Fecha de publicacion de cada mes del ipc y del mayorista, segun los informes de prensa.
    tests:
      - combinacion_unica:
          arguments:
            columnas: [dataset, fecha]
    columns:
      - name: publicado
        tests: [not_null]
