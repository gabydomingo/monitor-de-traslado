version: 2

models:
  - name: dim_rubro
    description: Los 19 rubros que se pueden comparar entre mayorista e ipc.
    columns:
      - name: par_id
        tests: [unique, not_null]
      - name: tiene_etapa_primaria
        description: Hay precio del productor (carnes, lacteos, pan, frutas, verduras).
      - name: es_contraste
        description: Energia. Es tarifa regulada, asi que no es traslado de mercado.

  - name: dim_region
    description: Regiones del ipc, el total nacional y el total del pais del mayorista.
    columns:
      - name: region
        tests: [unique, not_null]

  - name: dim_provincia
    description: Provincia y su region del ipc, para el mapa.
    columns:
      - name: provincia_id
        tests: [unique, not_null]
      - name: region
        tests:
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region

  - name: fct_precios
    description: >
      Cada rubro en cada etapa. Gondola viene por region, el mayorista solo como total
      del pais.
    tests:
      - combinacion_unica:
          arguments:
            columnas: [par_id, etapa, indicador, codigo, region, fecha]
    columns:
      - name: par_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_rubro')
                field: par_id
      - name: etapa
        tests:
          - accepted_values:
              arguments:
                values: [primaria, industria, gondola]
      - name: region
        tests:
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region

  - name: fct_revisiones
    description: Datos que el indec corrigio despues de publicarlos (indices y precios promedio).
