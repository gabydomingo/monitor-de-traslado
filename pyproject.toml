[project]
name = "monitor-de-traslado"
version = "0.1.0"
description = "Cuanto y en cuanto tiempo llega a la gondola una suba de precios mayoristas. Datos de la API del INDEC."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandera>=0.24",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "matplotlib>=3.11.2",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.isort]
known-local-folder = ["fakes"]
